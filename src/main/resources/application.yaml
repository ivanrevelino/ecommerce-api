spring:
  application:
    name: ecommerce-api

  datasource:
    url: ${DOCKER_DB_URL}
    username: ${DOCKER_DB_USERNAME}
    password: ${DOCKER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080